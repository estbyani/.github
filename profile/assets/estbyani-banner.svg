  <rect x="248" y="194" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="130" y="276" fill="#F3F1FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="550" letter-spacing="-0.7">Thoughtful questions. Meaningful answers.</text>
  <text x="130" y="320" fill="#B8BDD0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400">Open technology for clearer understanding and better decisions.</text>

