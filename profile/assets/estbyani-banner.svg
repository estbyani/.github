<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Estbyani</title>
  <desc id="desc">A refined purple and teal banner with the words Thoughtful questions. Meaningful answers.</desc>

  <defs>
    <linearGradient id="background" x1="90" y1="16" x2="1190" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121528"/>
      <stop offset="0.52" stop-color="#201B46"/>
      <stop offset="1" stop-color="#0C3037"/>
    </linearGradient>
    <linearGradient id="accent" x1="424" y1="134" x2="857" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9D91FF"/>
      <stop offset="1" stop-color="#43DFC0"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(304 78) rotate(35.3) scale(454 303)">
      <stop stop-color="#725EFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#725EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 356) rotate(-147) scale(477 286)">
